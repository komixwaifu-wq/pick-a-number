<style>

}

body:before,
body:after{

  pointer-events:none;
  z-index:-1;
  border-radius:50%;

}

body:before{
  width:180px;
  height:180px;
  right:-50px;
  bottom:60px;
  background:#ff5b9130;
  box-shadow:
    -700px -400px 0 #39d9ff12,
    -300px 150px 0 #ffd34e10;
}

body:after{
  width:100px;
  height:100px;
  left:-30px;
  top:300px;
  background:#39d9ff20;
}

h1,h2,h3{

}

.wrap{

.header{

.eyebrow{

}

.anime-banner{

  flex-wrap:wrap;
  margin:12px auto 20px;
}

.anime-tag{
  padding:6px 12px;

  background:#ffffff0d;

}

.panel{

  margin-bottom:18px;

.panel h3{
  font-size:15px;
  color:#a9c4e8;
  text-transform:uppercase;
  letter-spacing:.08em;

}

.setup-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  margin-bottom:15px;
}

@media(max-width:650px){
  .setup-grid{
    grid-template-columns:repeat(2,1fr);
  }

.player-box{
  position:relative;
}

.player-box input{
  width:100%;
  background:#020b21;
  border:1px solid #ffffff22;

  border-radius:10px;

}

.player-box input:focus{

}

.player-box.joined input{

}

.joined-dot{
  position:absolute;
  right:9px;

  height:7px;

.count-row label{

  font-weight:700;
}

.count-row select{
  background:#020b21;
  color:white;
  border:1px solid #ffffff22;
  border-radius:9px;
  padding:8px 12px;
  font-weight:800;
}

.row{

}

.btn:hover{

}

.btn:active{

.btn.blue{
  background:linear-gradient(145deg,#43ddff,#1772ed);

}

.btn.green{
  background:linear-gradient(145deg,#66ffb0,#1bcf72);
  color:#032615;
  box-shadow:0 4px 0 #08733c;
}

.btn.red{
  background:linear-gradient(145deg,#ff7588,#ef304b);

  box-shadow:0 4px 0 #8e1427;
}

.btn.ghost{
  background:#ffffff08;
  color:#bcd5f5;
  border:1px solid #ffffff22;
  box-shadow:none;
}

.btn.big{
  width:100%;
  min-height:110px;
  font-size:28px;
  letter-spacing:.03em;
  background:
    radial-gradient(circle at 50% 30%,#69ecff,#1671df 55%,#092d75);
  color:white;
  border:2px solid #69eaff77;
  box-shadow:
    0 0 20px #39d9ff44,
    0 8px 0 #041b50,

}

.btn.big:hover{
  box-shadow:
    0 0 35px #39d9ff88,
    0 8px 0 #041b50,

}

.status{
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

.notice{
  padding:11px 13px;
  border-radius:11px;
  background:#39d9ff0d;
  border:1px solid #39d9ff22;
  color:#bfeaff;
  font-size:13px;
  line-height:1.45;
}

.invite-box{
  padding:14px;
  border-radius:13px;
  background:#ffd34e13;
  border:1px solid #ffd34e3d;
  margin-bottom:15px;

.invite-box h4{

}

.invite-link{

.invite-link input{
  flex:1;

}

.invite-link .btn{
  padding:9px 14px;

}

.players{
  display:flex;

.chip{

  color:#bcd2ef;
  font-size:13px;

.chip.active{

.chip.done{
  color:#8da5c5;

.chip.you{

.race{
  text-align:center;

}

.race-title{
  color:var(--gold);

  font-size:18px;
  margin-bottom:7px;
}

.race-sub{
  color:var(--muted);

}

.winner{

  background:#4dff9a12;
  border:1px solid #4dff9a35;
  color:#75ffb7;
  font-weight:800;
  text-align:center;
  margin-top:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:9px;
  margin-bottom:18px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:repeat(5,1fr);
  }
}

.tile{
  aspect-ratio:1;
  border:0;
  border-radius:13px;
  background:linear-gradient(145deg,#12366f,#071b3e);
  color:white;
  font-family:'Baloo 2';
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  box-shadow:
    inset 0 0 0 1px #ffffff15,
    0 5px 0 #020b21,
    0 9px 15px #0006;
  transition:.12s;
}

.tile:hover:not(:disabled){
  transform:translateY(-3px) scale(1.02);
  border:1px solid #39d9ff66;
  box-shadow:
    0 0 16px #39d9ff33,
    0 7px 0 #020b21;
}

.tile:disabled{
  cursor:not-allowed;
  color:#637b9e;
  background:#0a1730;
  box-shadow:inset 0 0 0 1px #ffffff09;
}

.tile.used{
  color:#7188a7;
}

.tile .prize{
  display:block;
  font-size:10px;
  color:var(--gold);
  margin-top:-3px;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#020817d9;
  backdrop-filter:blur(6px);
}

.card{
  width:100%;
  max-width:480px;
  max-height:90vh;
  overflow:auto;
  background:linear-gradient(145deg,#0b2858,#030e27);
  border:1px solid #5edfff35;
  border-radius:22px;
  padding:24px;
  box-shadow:
    0 30px 70px #000c,
    0 0 30px #1683ff22;
  animation:pop .2s ease;
}

@keyframes pop{
  from{opacity:0;transform:scale(.92) translateY(12px)}
  to{opacity:1;transform:none}
}

.card .num{
  color:var(--cyan);
  font-family:'Baloo 2';
  font-weight:800;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:5px;
}

.card h2{
  font-size:26px;
  margin-bottom:14px;
}

.prompt{
  padding:16px;
  border-radius:13px;
  background:#ffffff0b;
  border:1px solid #ffffff12;
  font-size:17px;
  font-weight:800;
  line-height:1.5;
  margin-bottom:15px;
}

.answer{
  padding:14px;
  border-radius:12px;
  color:#021a0e;
  background:var(--green);
  font-family:'Baloo 2';
  font-size:21px;
  font-weight:800;
  margin-bottom:15px;
  text-align:center;
}

.prize-box{
  text-align:center;
  padding:14px;
  border-radius:13px;
  background:#ffd34e13;
  border:1px solid #ffd34e3d;
  margin-bottom:15px;
}

.prize-box small{
  display:block;
  color:#b9cce7;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.1em;
}

.prize-box strong{
  display:block;
  color:var(--gold);
  font-family:'Baloo 2';
  font-size:32px;
}

.choice-row{
  display:flex;
  gap:10px;
}

.choice{
  flex:1;
  border:0;
  border-radius:13px;
  padding:16px 8px;
  font-family:'Baloo 2';
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.choice.truth{
  background:#45e2d8;
  color:#032d2b;
}

.choice.dare{
  background:#ff5c79;
  color:#3b0612;
}

.bark{
  text-align:center;
  padding:16px;
  background:#ff536815;
  border:1px solid #ff536855;
  border-radius:14px;
  color:#ff8d9d;
  font-weight:800;
  margin-bottom:15px;
}

.bark .woof{
  font-size:25px;
  letter-spacing:3px;
  margin-top:8px;
}

.actions{
  display:flex;
  gap:9px;
  justify-content:flex-end;
  flex-wrap:wrap;
}

.log{
  max-height:220px;
  overflow:auto;
}

.log-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #ffffff0d;
  font-size:13px;
}

.log-item span:last-child{
  color:var(--gold);
  font-weight:800;
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  z-index:200;
  padding:11px 17px;
  border-radius:999px;
  background:#061633;
  border:1px solid #39d9ff44;
  box-shadow:0 8px 30px #0009;
  color:white;
  font-weight:800;
  font-size:13px;
}

.room-info{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #ffffff0d;
}

.room-id{
  color:var(--cyan);
  font-weight:800;
  font-family:monospace;
}

.sync-status{
  position:fixed;
  bottom:20px;
  right:20px;
  padding:8px 14px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  background:#061633;
  border:1px solid #4dff9a55;
  color:#4dff9a;
  z-index:50;
}

.sync-status.offline{
  border-color:#ff7d8e55;
  color:#ff7d8e;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <div class="eyebrow">LIVE MULTIPLAYER · FIRST TO CLICK</div>
    <h1>🎯 Anime Pick Battle</h1>
    <p>
      40 numbers · prizes · math · truth or dare · fastest player wins the pick
    </p>

    <div class="anime-banner">
      <span class="anime-tag">⚡ SPEED BATTLE</span>
      <span class="anime-tag">🎌 ANIME STYLE</span>
      <span class="anime-tag">💰 ₱10–₱100</span>
      <span class="anime-tag">🐶 CONSEQUENCE</span>
    </div>
  </div>

  <div id="app"></div>

</div>

<div class="sync-status" id="syncStatus">🟢 Connected</div>

<script>

/* ============================================================
   FIREBASE INIT
============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyCjDVQzoG6x2pspZs3uyziqTirj8YtoMQ4",
  authDomain: "anime-pick-battle.firebaseapp.com",
  databaseURL: "https://anime-pick-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "anime-pick-battle",
  storageBucket: "anime-pick-battle.firebasestorage.app",
  messagingSenderId: "665318921799",
  appId: "1:665318921799:web:eac5da6af99e80f7550362",
  measurementId: "G-K42RTTWRD5"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

/* ============================================================
   CONTENT
============================================================ */

const MATH = [
  {q:"6 + 2 × 5",a:16},
  {q:"20 − 3 × 4",a:8},
  {q:"(8 + 2) × 3",a:30},
  {q:"18 ÷ 3 + 4",a:10},
  {q:"5 × 4 − 6 ÷ 2",a:17},
  {q:"12 + 8 ÷ 4",a:14},
  {q:"(10 − 4) × 2",a:12},
  {q:"9 + 3 × 3 − 5",a:13},
  {q:"24 ÷ (2 + 4)",a:4},
  {q:"7 × 2 + 6 × 3",a:32},
  {q:"15 − 2 × 5 + 1",a:6},
  {q:"(6 + 6) ÷ 3",a:4},
  {q:"4 × 4 − 2 × 3",a:10},
  {q:"30 ÷ 5 + 2 × 3",a:12},
  {q:"8 + (5 − 2) × 4",a:20},
  {q:"2 × 3 × 4 − 5",a:19},
  {q:"16 − 8 ÷ 2",a:12},
  {q:"(7 + 3) × (2 + 1)",a:30},
  {q:"9 × 2 − 3 × 4",a:6},
  {q:"5 + 6 × 2 − 4",a:13}
];

const TOD = [
  {truth:"What's the most embarrassing song on your playlist?",dare:"Roll on the floor from one side of the room to the other."},
  {truth:"What's a food combo you love that everyone else thinks is gross?",dare:"Jump up and down 10 times, counting out loud."},
  {truth:"What's the last thing you Googled?",dare:"Say this out loud while skipping every word with the letter A: 'A cat and a rat ran away from a bad dragon.'"},
  {truth:"What's a rule you always break?",dare:"Put a small dab of shampoo in your hair and style it into a mohawk."},
  {truth:"What's the pettiest thing you've ever argued about?",dare:"Do 10 jumping jacks."},
  {truth:"What app do you spend the most time on?",dare:"Talk in a robot voice for the next 3 things you say."},
  {truth:"What's a song you know all the words to but won't admit?",dare:"Balance a book on your head for 30 seconds."},
  {truth:"What's the weirdest thing in your bag or pockets?",dare:"Do your best animal impression for 10 seconds."},
  {truth:"Who was the last person you stalk-checked on social media?",dare:"Let another player draw something silly on the back of your hand."},
  {truth:"What's a talent nobody knows you have?",dare:"Dance for 15 seconds with no music."},
  {truth:"What's your most-used emoji?",dare:"Hold a plank for 20 seconds."},
  {truth:"What's something you pretend to understand but don't?",dare:"Say the alphabet backwards."},
  {truth:"What's the last lie you told?",dare:"Try to lick your own elbow for 10 seconds."},
  {truth:"What's a habit you're trying to break?",dare:"Do 5 push-ups. Knees are fine."},
  {truth:"What's the most trouble you've been in?",dare:"Wear your socks on your hands until your next turn."},
  {truth:"What's a fear you have that seems silly?",dare:"Speak only in rhymes for your next 3 sentences."},
  {truth:"What's your go-to karaoke song?",dare:"Do your best impression of the person running this game."},
  {truth:"What's the longest you've gone without showering?",dare:"Freeze in the silliest pose you can make for 10 seconds."},
  {truth:"What's a text you sent to the wrong person?",dare:"Give every other player a genuine compliment."},
  {truth:"What's your most irrational habit?",dare:"Let the group pick a funny nickname for you for 3 rounds."}
];

const CONTENT = {};
for(let i=0;i<20;i++){
  CONTENT[i*2+1] = {type:"math", ...MATH[i]};
  CONTENT[i*2+2] = {type:"tod", ...TOD[i]};
}

const LOW_PRIZES = [10,20,30,40];
const HIGH_PRIZES = [50,60,70,80,90,100];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function generatePrizes(){
  let prizes=[];
  for(const p of LOW_PRIZES){
    for(let i=0;i<3;i++){
      prizes.push(p);
    }
  }
  for(const p of HIGH_PRIZES){
    prizes.push(p);
    prizes.push(p);
  }
  for(let i=0;i<16;i++){
    prizes.push(LOW_PRIZES[i % LOW_PRIZES.length]);
  }

  let result;
  for(let attempt=0;attempt<500;attempt++){
    result=shuffle(prizes);
    let valid=true;
    for(let i=2;i<result.length;i++){
      if(result[i]===result[i-1] && result[i]===result[i-2]){
        valid=false;
        break;
      }
    }
    if(valid) break;
  }
  return result;
}

/* ============================================================
   STATE
============================================================ */

let state = null;
let gameRef = null;
let roomId = getRoomIdFromUrl() || generateRoomId();
let loading = true;
let pendingId = null;
let pendingChoice = null;
let revealAnswer = false;
let answerCorrect = null;
let editingInput = false;
let isOnline = true;

const app = document.getElementById("app");
const syncStatus = document.getElementById("syncStatus");

function getRoomIdFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return params.get('room') || null;
}

function generateRoomId(){
  return Math.random().toString(36).substring(2,8).toUpperCase();
}

function updateUrlWithRoom(roomId){
  const url = new URL(window.location);
  url.searchParams.set('room', roomId);
  window.history.replaceState({}, '', url);
}

/* ============================================================
   FIREBASE SYNC
============================================================ */

function initializeFirebaseSync(){
  updateUrlWithRoom(roomId);
  gameRef = database.ref(`games/${roomId}`);

  gameRef.on('value', snapshot => {
    if(!snapshot.exists()){
      state = defaultState();
    }else{
      state = snapshot.val();
    }
    loading = false;
    render();
  });

  database.ref('.info/connected').on('value', snap => {
    isOnline = snap.val() === true;
    updateSyncStatus();
  });
}

function updateSyncStatus(){
  if(isOnline){
    syncStatus.textContent = "🟢 Connected";
    syncStatus.classList.remove('offline');
  }else{
    syncStatus.textContent = "🔴 Offline";
    syncStatus.classList.add('offline');
  }
}

async function saveState(){
  try{
    await gameRef.set(state);
    return true;
  }catch(err){
    console.error("Save failed:", err);
    return false;
  }
}

function defaultState(){
  return {
    roomId: roomId,
    started: false,
    playerCount: 10,
    players: Array.from({length:10}, (_,i)=>`Player ${i+1}`),
    joined: Array(10).fill(false),
    prizes: [],
    entries: {},
    winner: null,
    turnActive: false,
    turnId: 0,
    logs: [],
    finished: false
  };
}

/* ============================================================
   HELPERS
============================================================ */

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function activePlayers(){
  return state.players.slice(0,state.playerCount).filter((_,i)=>state.joined[i]);
}

function activePlayerCount(){
  return activePlayers().length;
}

function playerName(index){
  return state.players[index] || `Player ${index+1}`;
}

function getWinner(){
  return state.winner === null ? null : state.winner;
}

function randomId(){
  return Date.now()+"-"+Math.random().toString(36).slice(2);
}

function toast(message){
  const old=document.querySelector(".toast");
  if(old) old.remove();

  const t=document.createElement("div");
  t.className="toast";
  t.textContent=message;
  document.body.appendChild(t);

  setTimeout(()=>{
    t.remove();
  },2500);
}

function getInviteLink(){
  const base = window.location.origin + window.location.pathname;
  return `${base}?room=${state.roomId}`;
}

function copyToClipboard(text){
  navigator.clipboard.writeText(text).then(()=>{
    toast("Invite link copied!");
  });
}

/* ============================================================
   RENDER
============================================================ */

function render(){
  if(loading){
    app.innerHTML=`<p class="status">Loading game…</p>`;
    return;
  }

  if(!state.started){
    renderLobby();
    return;
  }

  renderGame();

  if(pendingId!==null){
    renderModal();
  }
}

/* ============================================================
   LOBBY
============================================================ */

function renderLobby(){
  const count=state.playerCount || 10;
  let inputs="";

  for(let i=0;i<count;i++){
    const joined=!!state.joined[i];
    inputs+=`
      <div class="player-box ${joined?"joined":""}">
        <input
          data-player="${i}"
          value="${escapeHtml(state.players[i] || `Player ${i+1}`)}"
          placeholder="Player ${i+1}"
          autocomplete="off"
        >
        ${joined ? `<span class="joined-dot"></span>` : ""}
      </div>
    `;
  }

  const inviteLink = getInviteLink();

  app.innerHTML=`

    <div class="panel">

      <h3>🎮 Game Lobby</h3>

      <div class="notice">
        Choose how many players will actually play.
        Each player can enter their name. Share your invite link with friends!
      </div>

      <div class="invite-box">
        <h4>📤 Invite Friends</h4>
        <div class="invite-link">
          <input type="text" id="inviteInput" value="${inviteLink}" readonly>
          <button class="btn blue" id="copyBtn" style="padding: 9px 14px; font-size: 13px;">
            📋 Copy Link
          </button>
        </div>
        <div class="room-info">
          Room ID: <span class="room-id">${state.roomId}</span>
        </div>
      </div>

      <br>

      <div class="count-row">
        <label>Number of players:</label>
        <select id="playerCount">
          ${Array.from({length:40}, (_,i)=>{
            const n=i+1;
            return `<option value="${n}" ${n===count?"selected":""}>${n}</option>`;
          }).join("")}
        </select>
      </div>

      <div class="setup-grid">
        ${inputs}
      </div>

      <div class="row">
        <button class="btn green" id="joinBtn">
          ✓ Join / Update My Name
        </button>

        <button class="btn" id="startBtn">
          🚀 Start Game
        </button>
      </div>

    </div>

    <div class="panel">

      <h3>👥 Players currently in lobby</h3>

      <div class="players">
        ${
          activePlayerCount()
          ? state.players
              .slice(0,count)
              .map((name,i)=>{
                if(!state.joined[i]) return "";
                return `<span class="chip you">🟢 ${escapeHtml(name)}</span>`;
              }).join("")
          : `<span class="status">No players have joined yet.</span>`
        }
      </div>

      <p class="status">
        ${activePlayerCount()} player${activePlayerCount()===1?"":"s"} joined
      </p>

    </div>

  `;

  document.getElementById("copyBtn").addEventListener("click", ()=>{
    copyToClipboard(inviteLink);
  });

  const countSelect = document.getElementById("playerCount");
  countSelect.addEventListener("change", async e=>{
    if(editingInput) return;

    state.playerCount = Number(e.target.value);

    while(state.players.length < state.playerCount){
      state.players.push(`Player ${state.players.length+1}`);
      state.joined.push(false);
    }

    state.players = state.players.slice(0, state.playerCount);
    state.joined = state.joined.slice(0, state.playerCount);

    await saveState();
  });

  app.querySelectorAll(".setup-grid input").forEach(input=>{
    input.addEventListener("focus", ()=>{
      editingInput=true;
    });

    input.addEventListener("blur", async e=>{
      editingInput=false;
      const idx = Number(e.target.dataset.player);
      const value = e.target.value.trim();
      state.players[idx] = value || `Player ${idx+1}`;
      await saveState();
    });

    input.addEventListener("input", e=>{
      const idx = Number(e.target.dataset.player);
      state.players[idx] = e.target.value;
    });
  });

  document.getElementById("joinBtn").addEventListener("click", async ()=>{
    const inputs = app.querySelectorAll(".setup-grid input");
    inputs.forEach(input=>{
      const idx = Number(input.dataset.player);
      const name = input.value.trim();
      state.players[idx] = name || `Player ${idx+1}`;
      state.joined[idx] = true;
    });

    await saveState();
    toast("Player list updated!");
  });

  document.getElementById("startBtn").addEventListener("click", startGame);
}

/* ============================================================
   START GAME
============================================================ */

async function startGame(){
  const inputs = app.querySelectorAll(".setup-grid input");
  inputs.forEach(input=>{
    const idx = Number(input.dataset.player);
    const name = input.value.trim();
    state.players[idx] = name || `Player ${idx+1}`;
  });

  if(activePlayerCount()<1){
    alert("At least 1 player must join the game.");
    return;
  }

  state.prizes = generatePrizes();
  state.started = true;
  state.finished = false;
  state.entries = {};
  state.winner = null;
  state.turnActive = true;
  state.turnId = randomId();
  state.logs = [];

  await saveState();
  toast("GAME STARTED! FIRST TO CLICK!");
}

/* ============================================================
   GAME BOARD
============================================================ */

function renderGame(){
  const used = new Set(Object.keys(state.entries).map(Number));
  const remaining = 40-used.size;

  let tiles="";
  for(let n=1;n<=40;n++){
    const isUsed = used.has(n);
    const prize = state.prizes[n-1] || 10;

    tiles+=`
      <button
        class="tile ${isUsed?"used":""}"
        data-number="${n}"
        ${isUsed?"disabled":""}
      >
        ${n}
        ${isUsed ? `<span class="prize">₱${prize}</span>` : ""}
      </button>
    `;
  }

  let players="";
  for(let i=0; i<state.playerCount; i++){
    if(!state.joined[i]) continue;

    const name = playerName(i);
    const hasPicked = Object.values(state.entries).some(e=>e.playerIndex===i);
    const isWinner = getWinner()===i;

    players+=`
      <span class="chip ${isWinner?"active":""} ${hasPicked?"done":""}">
        ${isWinner?"⚡ ":"🟢 "}
        ${escapeHtml(name)}
      </span>
    `;
  }

  const winner = getWinner();
  let raceHTML="";

  if(winner!==null && winner!==undefined){
    raceHTML=`
      <div class="winner">
        ⚡ FASTEST PLAYER:
        <strong>${escapeHtml(playerName(winner))}</strong>
        <br>
        <small>Pick a number below.</small>
      </div>
    `;
  }else{
    raceHTML=`
      <div class="race">
        <div class="race-title">⚡ WHO'S THE FASTER?</div>
        <div class="race-sub">Everyone tap the button as fast as possible. The FIRST click wins!</div>
        <button class="btn big" id="fastButton">⚡ TAP FIRST TO PICK! ⚡</button>
      </div>
    `;
  }

  app.innerHTML=`
    ${raceHTML}

    <div class="panel">
      <h3>🔢 Choose a number</h3>
      <div class="grid">
        ${tiles}
      </div>
      <p class="status">${remaining} number${remaining===1?"":"s"} remaining</p>
    </div>

    <div class="panel">
      <h3>👥 Players in this game</h3>
      <div class="players">
        ${players}
      </div>
    </div>

    ${
      state.logs.length
      ? `
        <div class="panel">
          <h3>📜 Game History</h3>
          <div class="log">
            ${state.logs.slice().reverse().slice(0,30).map(log=>`
              <div class="log-item">
                <span>${escapeHtml(log.text)}</span>
                <span>${log.prize ? "₱"+log.prize : ""}</span>
              </div>
            `).join("")}
          </div>
        </div>
      `
      : ""
    }

    <div class="row" style="justify-content:center">
      <button class="btn ghost" id="resetBtn">🔄 Reset Game</button>
    </div>

    <p class="status">
      ${isOnline ? "🟢 Live game — syncing in real-time!" : "⚠️ Offline mode"}
    </p>
  `;

  const fastButton = document.getElementById("fastButton");
  if(fastButton){
    fastButton.addEventListener("click", claimTurn);
  }

  app.querySelectorAll(".tile[data-number]").forEach(button=>{
    button.addEventListener("click", ()=>{
      const n = Number(button.dataset.number);
      chooseNumber(n);
    });
  });

  document.getElementById("resetBtn").addEventListener("click", resetGame);
}

/* ============================================================
   FIRST-TO-CLICK
============================================================ */

async function claimTurn(){
  if(state.started && state.turnActive && state.winner===null){
    const playerIndex = chooseLocalPlayer();
    if(playerIndex===null) return;

    state.winner = playerIndex;
    state.turnActive = false;
    state.turnId = randomId();

    state.logs.push({
      text: `${playerName(playerIndex)} won the click race!`,
      time: Date.now()
    });

    await saveState();
    toast("⚡ You won the click race!");
  }
}

const LOCAL_PLAYER_KEY = "anime-pick-local-player";

function getLocalPlayer(){
  const value = localStorage.getItem(LOCAL_PLAYER_KEY);
  if(value===null) return null;
  return Number(value);
}

function chooseLocalPlayer(){
  let current = getLocalPlayer();

  if(current!==null && state.joined[current]){
    return current;
  }

  const players = activePlayers();

  if(players.length===1){
    const idx = state.players.findIndex((name,i)=>state.joined[i]);
    localStorage.setItem(LOCAL_PLAYER_KEY, String(idx));
    return idx;
  }

  let message = "Who are you?\n\n";
  players.forEach((name,index)=>{
    const realIndex = state.players.findIndex((n,i)=>n===name && state.joined[i]);
    message += `${realIndex+1}. ${name}\n`;
  });
  message += "\nEnter the PLAYER NUMBER:";

  const answer = prompt(message);
  if(answer===null) return null;

  const index = Number(answer)-1;

  if(index<0 || index>=state.playerCount || !state.joined[index]){
    alert("That player is not in the lobby.");
    return null;
  }

  localStorage.setItem(LOCAL_PLAYER_KEY, String(index));
  return index;
}

/* ============================================================
   CHOOSE NUMBER
============================================================ */

async function chooseNumber(n){
  if(getWinner()===null || getWinner()===undefined){
    toast("First win the click race!");
    return;
  }

  if(state.entries[n]){
    toast("That number was already chosen!");
    return;
  }

  pendingId=n;
  pendingChoice=null;
  revealAnswer=false;
  answerCorrect=null;
  render();
}

/* ============================================================
   MODAL
============================================================ */

function renderModal(){
  const n=pendingId;
  if(n===null) return;

  const content=CONTENT[n];
  const prize=state.prizes[n-1] || 10;

  const overlay=document.createElement("div");
  overlay.className="overlay";

  let inner="";

  if(content.type==="math"){
    inner=`
      <div class="num">Number ${n} · ${escapeHtml(playerName(getWinner()))}'s pick</div>
      <div class="prize-box">
        <small>Prize</small>
        <strong>₱${prize}</strong>
      </div>
      <h2>🧠 Solve the math!</h2>
      <div class="prompt">${escapeHtml(content.q)} = ?</div>

      ${
        revealAnswer
        ? `
          <div class="answer">Answer: ${content.a}</div>
          ${
            answerCorrect===null
            ? `
              <div class="row">
                <button class="btn green" id="correctBtn">✅ CORRECT</button>
                <button class="btn red" id="wrongBtn">❌ WRONG</button>
              </div>
            `
            : answerCorrect
              ? `<div class="winner">🎉 Correct! ${escapeHtml(playerName(getWinner()))} gets another pick!</div>`
              : `
                <div class="bark">
                  ❌ Wrong answer!
                  <br>
                  Consequence: Bark like a dog 10 times.
                  <div class="woof">WOOF! WOOF! WOOF! WOOF! WOOF!<br>WOOF! WOOF! WOOF! WOOF! WOOF!</div>
                </div>
              `
          }
        `
        : `<div class="actions"><button class="btn" id="revealBtn">👀 Reveal Answer</button></div>`
      }

      ${answerCorrect!==null ? `<div class="actions" style="margin-top:15px"><button class="btn" id="finishPickBtn">${answerCorrect ? "⚡ Pick Again" : "➡️ End Turn"}</button></div>` : ""}
    `;
  }else{
    if(!pendingChoice){
      inner=`
        <div class="num">Number ${n} · ${escapeHtml(playerName(getWinner()))}'s pick</div>
        <div class="prize-box">
          <small>Prize</small>
          <strong>₱${prize}</strong>
        </div>
        <h2>🎌 Truth or Dare?</h2>
        <div class="choice-row">
          <button class="choice truth" id="truthBtn">💬 TRUTH</button>
          <button class="choice dare" id="dareBtn">🔥 DARE</button>
        </div>
      `;
    }else{
      const isDare = pendingChoice==="dare";
      inner=`
        <div class="num">Number ${n} · ${escapeHtml(playerName(getWinner()))}'s pick</div>
        <div class="prize-box">
          <small>Prize</small>
          <strong>₱${prize}</strong>
        </div>
        <h2>${isDare ? "🔥 Do it!" : "💬 Answer honestly!"}</h2>
        <div class="prompt">${escapeHtml(isDare ? content.dare : content.truth)}</div>
        <div class="actions">
          <button class="btn" id="finishPickBtn">✓ Completed — Continue</button>
        </div>
      `;
    }
  }

  overlay.innerHTML = `<div class="card">${inner}</div>`;
  app.appendChild(overlay);

  const revealBtn = document.getElementById("revealBtn");
  if(revealBtn){
    revealBtn.addEventListener("click", ()=>{
      revealAnswer=true;
      render();
    });
  }

  const correctBtn = document.getElementById("correctBtn");
  if(correctBtn){
    correctBtn.addEventListener("click", ()=>{
      answerCorrect=true;
      render();
    });
  }

  const wrongBtn = document.getElementById("wrongBtn");
  if(wrongBtn){
    wrongBtn.addEventListener("click", ()=>{
      answerCorrect=false;
      render();
    });
  }

  const truthBtn = document.getElementById("truthBtn");
  if(truthBtn){
    truthBtn.addEventListener("click", ()=>{
      pendingChoice="truth";
      render();
    });
  }

  const dareBtn = document.getElementById("dareBtn");
  if(dareBtn){
    dareBtn.addEventListener("click", ()=>{
      pendingChoice="dare";
      render();
    });
  }

  const finishBtn = document.getElementById("finishPickBtn");
  if(finishBtn){
    finishBtn.addEventListener("click", commitPick);
  }
}

/* ============================================================
   COMMIT PICK
============================================================ */

async function commitPick(){
  const n=pendingId;
  if(n===null) return;

  const winner = getWinner();
  if(winner===null || winner===undefined) return;

  state.entries[n]={
    playerIndex:winner,
    choice: CONTENT[n].type==="tod" ? pendingChoice : null,
    correct: CONTENT[n].type==="math" ? answerCorrect : true,
    prize: state.prizes[n-1] || 10,
    time:Date.now()
  };

  state.logs.push({
    text: `${playerName(winner)} picked #${n}`,
    prize: state.prizes[n-1] || 10,
    time:Date.now()
  });

  if(CONTENT[n].type==="math" && answerCorrect===true){
    state.winner=winner;
    state.turnActive=false;
  }else{
    state.winner=null;
    state.turnActive=true;
  }

  if(Object.keys(state.entries).length>=40){
    state.finished=true;
    state.turnActive=false;
    state.winner=null;
  }

  pendingId=null;
  pendingChoice=null;
  revealAnswer=false;
  answerCorrect=null;

  await saveState();

  if(state.finished){
    toast("🏆 GAME FINISHED!");
  }else{
    toast("⚡ Ready for the next fastest click!");
  }
}

/* ============================================================
   RESET
============================================================ */

async function resetGame(){
  if(!confirm("Reset the entire game for everyone?")) return;

  state=defaultState();
  pendingId=null;
  pendingChoice=null;
  revealAnswer=false;
  answerCorrect=null;

  await saveState();
  toast("Game reset.");
}

   BOOT
============================================================ */

// Wait for Firebase to load
function waitForFirebase() {
  if(typeof firebase !== 'undefined') {
    initializeFirebaseSync();
  } else {
    setTimeout(waitForFirebase, 100);
  }
}

// Load Firebase scripts
const script1 = document.createElement('script');
script1.src = 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
script1.async = true;

const script2 = document.createElement('script');
script2.src = 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';
script2.async = true;

script1.onload = () => {
  document.body.appendChild(script2);
  script2.onload = () => {
    waitForFirebase();
  };
  script2.onerror = () => {
    console.error('Failed to load Firebase database script');
    showError('Failed to connect to Firebase. Please refresh the page.');
  };
};

script1.onerror = () => {
  console.error('Failed to load Firebase app script');
  showError('Failed to connect to Firebase. Please refresh the page.');
};

document.head.appendChild(script1);

function showError(msg) {
  app.innerHTML = `<div class="panel" style="background: #ff536815; border-color: #ff536855;"><p class="status" style="color: #ff8d9d;">${msg}</p></div>`;
}

</script>
